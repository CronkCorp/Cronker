# Starts Cronk and its Postgres. Cronk is configured only by environment variables;
# set CRONK_PUBLIC_URL to the public HTTPS address it is reached at (a tunnel in
# development, a server in real use). Left unset, it is http://localhost:<CRONK_PORT>
# for a local try.
services:
  cronk:
    build: .
    ports:
      - "${CRONK_PORT:-3000}:3000"
    environment:
      CRONK_PUBLIC_URL: ${CRONK_PUBLIC_URL:-http://localhost:${CRONK_PORT:-3000}}
      DATABASE_URL: postgres://cronk:${POSTGRES_PASSWORD:-cronk}@postgres:5432/cronk
      # Encrypts the secrets Cronk keeps, such as the GitHub App's credentials. Set it to
      # something like `openssl rand -base64 32` and keep it: without it, sign-in with GitHub stops.
      CRONK_SECRET_KEY: ${CRONK_SECRET_KEY:-}
      # Attachments are files in this directory, so a backup is the database plus this volume.
      CRONK_ATTACHMENTS_DIR: /app/data/attachments
      CRONK_ATTACHMENT_LIMIT_MB: ${CRONK_ATTACHMENT_LIMIT_MB:-25}
    volumes:
      - attachments:/app/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cronk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cronk}
      POSTGRES_DB: cronk
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cronk -d cronk"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres:
  attachments:
