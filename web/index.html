<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cronk</title>
    <script>
      // Applies the theme chosen on this browser before first paint, so the page never flashes the other one.
      // The key and values are those of web/src/storage.ts.
      try {
        var theme = localStorage.getItem("cronk_theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
