name: Release

# Stages the `cronk-runner` daemon on npm whenever a Release of Cronk is published, at the same version. A maintainer
# approves it with 2FA before anyone can install it (`docs/releasing.md`).
on:
  release:
    types: [published]

jobs:
  stage-runner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm's trusted publishing: the job proves to npm which Repository and workflow it is, so there is no npm token.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:daemon
      - name: Check daemon/package.json matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./daemon/package.json").version')"
          if [ "v${version#v}" != "v${TAG#v}" ]; then
            echo "::error::daemon/package.json is $version but the Release is $TAG: bump it as docs/releasing.md says."
            exit 1
          fi
      # `npm stage` needs npm 11.15 or later; Node 22 comes with npm 10.
      - run: npm install -g npm@11.21.3
      - name: Stage cronk-runner
        working-directory: daemon
        run: npm stage publish --access public $([ "${{ github.event.release.prerelease }}" = "true" ] && echo "--tag next")
